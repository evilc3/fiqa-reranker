[project]
name = "fiqa-reranker"
version = "0.1.0"
description = "Reproducible BEIR FiQA cross-encoder reranker learning pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beir>=2.2.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "ranx>=0.3.21",
    "scikit-learn>=1.9.1",
    "torch==2.9.1+cu126",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
